# «Что собираем?» на puzzle.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/puzzle и линкуется в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name puzzle.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/puzzle.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puzzle.burninghouse.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name puzzle.burninghouse.ru;
    return 301 https://$host$request_uri;
}
