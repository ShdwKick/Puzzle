# «Что собираем?» на puzzle.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/puzzle и линкуется в sites-enabled.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name puzzle.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/puzzle.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puzzle.burninghouse.ru/privkey.pem;

    # HSTS (см. правку «SEO-аудит») — сообщает браузеру навсегда (в пределах
    # max-age) сразу ходить сюда по https, минуя редирект с :80. Год —
    # обычная практика, includeSubDomains — поддоменов у puzzle. нет и не
    # планируется, но не вредит. Без preload: это отдельное, труднее
    # обратимое обязательство (требует ручной заявки на удаление из
    # предзагруженного списка браузеров), добавлять — отдельное решение, не
    # попутно с этой правкой. always — заголовок нужен и на 4xx/5xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Фото пазла: клиент сжимает до ~2000px/JPEG 0.86, но предел
    # сервиса — 4 МБ (MAX_PHOTO_BYTES). У nginx свой лимит 1 МБ по
    # умолчанию — без этой строки крупная загрузка отвалится 413 ещё
    # до сервиса (тот же приём, что у Trip, deploy/nginx-trip-443.conf).
    client_max_body_size 8m;

    # Сжатие текстовых ответов (см. план «SEO») — само приложение (server.js)
    # ничего не сжимает, только nginx-прокси может. app.js/styles.css отдаются
    # без хэша в имени (см. serveStatic), поэтому это чисто про размер
    # передачи, не про кэш — тот заголовок отдельно, из Node (Cache-Control).
    # image/* исключены намеренно: PNG/JPEG/WebP уже сжаты, повторное сжатие
    # только жжёт CPU без выигрыша в размере.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        # Без этих двух заголовков WebSocket (комнаты, см. ws-server.js)
        # не поднимется через прод-nginx — апгрейд-запрос дойдёт как
        # обычный HTTP и получит обычный ответ вместо 101. Найдено и
        # починено попутно, при редактировании этого файла ради лимита
        # тела — раньше было не с чем сравнить, комнаты через прод ещё
        # не разворачивались.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name puzzle.burninghouse.ru;
    return 301 https://$host$request_uri;
}
